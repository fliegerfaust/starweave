<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пророчества · Starweave 0.7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Кит витрин 0.7 «Глубина» — язык «Латунной обсерватории» (DESIGN.md) */
:root {
  --night-0: #05061a;
  --night-1: #0c0d2c;
  --night-2: #191641;
  --panel: rgb(14 12 38 / 0.82);
  --panel-solid: #0e0c26;
  --ink: #eae6ff;
  --ink-dim: #a5a0cf;
  --ink-faint: #8a85b8;
  --gold: #f6c25b;
  --gold-hi: #ffe6a8;
  --gold-deep: #e09a2f;
  --gold-rgb: 246 194 91;
  --light: #7fe0ff;
  --light-rgb: 127 224 255;
  --mult: #ff6b8b;
  --mult-rgb: 255 107 139;
  --ok: #7cf0b0;
  --danger: #ff5370;
  --pearl: #e8e4f4;
  --brass: rgb(246 194 91 / 0.3);
  --hair: rgb(246 194 91 / 0.16);
  --line: rgb(234 230 255 / 0.08);
  --sun: #f6c25b;
  --moon: #8fd0ff;
  --star: #c39bff;
  --comet: #ff7f62;
  --font-display: 'Forum', 'Times New Roman', serif;
  --font-body: 'Manrope', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: rgb(246 194 91 / 0.35) transparent; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 60% at 50% 0%, #191641 0%, #0c0d2c 38%, #05061a 100%) fixed, var(--night-0);
  color: var(--ink);
  font: 400 14px/1.5 var(--font-body);
  overflow-x: hidden;
}
::selection { background: rgb(246 194 91 / 0.35); color: #fff6e0; }
:focus-visible { outline: 2px solid rgb(255 230 168 / 0.8); outline-offset: 3px; border-radius: 6px; }
img, canvas, svg { display: block; }
img { max-width: none; }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #08081e; }
button { font: inherit; color: inherit; }
b, strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.c-light { color: var(--light); font-weight: 800; }
.c-mult { color: var(--mult); font-weight: 800; }
.c-gold { color: var(--gold-hi); font-weight: 800; }
.c-dim { color: var(--ink-dim); }
.c-ok { color: var(--ok); font-weight: 700; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: clip; }

/* Навигация между витринами */
.vt-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; margin: 0 -16px; padding: 8px 16px;
  background: linear-gradient(180deg, rgb(8 8 30 / 0.97) 72%, rgb(8 8 30 / 0)); }
.vt-nav a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 6px; color: var(--gold); text-decoration: none; font: 700 13.5px/1 var(--font-body); }
.vt-nav a:hover { color: var(--gold-hi); }
.vt-nav .sp { flex: 1; }
.vt-nav .pg { color: var(--ink-faint); font: 700 12px/1 var(--font-body); letter-spacing: 0.08em; }
.vt-nav svg { width: 16px; height: 16px; }

/* Шапка-табличка */
.top { text-align: center; padding: 18px 0 4px; }
.top h1 { margin: 0; font: 400 clamp(26px, 6.4vw, 40px)/1.02 var(--font-display); letter-spacing: 0.14em; padding-left: 0.14em; text-transform: uppercase; color: var(--gold-hi); text-wrap: balance; }
.sill { height: 2px; width: min(420px, 80%); margin: 14px auto 0; background: radial-gradient(50% 100% at 50% 50%, rgb(255 230 168 / 0.9), rgb(246 194 91 / 0.35) 45%, transparent 100%); }
.top p { max-width: 620px; margin: 14px auto 0; color: var(--ink-dim); font-size: 15px; text-wrap: pretty; }
.top p b { color: var(--ink); }

/* Подписи разделов */
.label { display: flex; align-items: center; gap: 12px; margin: 36px 0 14px; font: 400 13px/1 var(--font-display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-hi); }
.label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hair), transparent); }
.label small { font: 600 11.5px/1 var(--font-body); letter-spacing: 0.02em; text-transform: none; color: var(--ink-faint); }

/* Раскладка «прототип + суть» */
.split { display: grid; gap: 28px; margin-top: 24px; }
@media (min-width: 900px) { .split { grid-template-columns: 420px minmax(0, 1fr); align-items: start; } .split .aside { position: sticky; top: 72px; } }

/* Сцена прототипа: живое небо */
.stage { position: relative; width: 100%; max-width: 420px; margin: 0 auto; min-height: 640px; border-radius: 24px; overflow: hidden; isolation: isolate;
  background: radial-gradient(120% 70% at 50% 0%, #1c1850 0%, #0c0d2c 50%, #05061a 100%);
  box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.3), 0 30px 60px -20px rgb(0 0 0 / 0.8); clip-path: inset(0 round 24px); }
.stage > .neb { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; opacity: 0.55; }
.stage > canvas.stars { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
.stage-inner { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 640px; padding: 18px 16px 16px; }
.stage-head { display: grid; justify-items: center; gap: 6px; text-align: center; }
.plate-title { font: 400 18px/1 var(--font-display); letter-spacing: 0.2em; padding-left: 0.2em; text-transform: uppercase; color: var(--gold-hi); }
.plate-sub { font: 600 12.5px/1.35 var(--font-body); color: var(--ink-dim); text-wrap: balance; }
.stage-foot { margin-top: auto; display: grid; gap: 8px; }
.stage-note { font: 600 12px/1.4 var(--font-body); color: var(--ink-faint); text-align: center; min-height: 17px; text-wrap: balance; }

/* Кнопки — как в игре */
.btn { position: relative; appearance: none; border: 0; border-radius: 999px; min-height: 48px; padding: 10px 22px; font: 700 15px/1.1 var(--font-body);
  letter-spacing: 0.02em; color: #1a1206; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.12s ease, filter 0.12s ease, opacity 0.2s ease, box-shadow 0.2s ease; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; filter: grayscale(0.6); }
.btn-primary { min-height: 52px; background: linear-gradient(180deg, #ffe09a 0%, #f6c25b 55%, #e09a2f 100%);
  box-shadow: 0 0 0 1px rgba(255, 230, 160, 0.5) inset, 0 6px 14px -8px rgb(246 194 91 / 0.45), 0 2px 5px rgb(0 0 0 / 0.35); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn-secondary { color: var(--gold-hi); background: radial-gradient(120% 140% at 50% 0%, rgb(var(--gold-rgb) / 0.09), transparent 70%), rgb(14 12 34 / 0.86); box-shadow: inset 0 0 0 1px var(--brass); }
.btn-secondary:hover:not(:disabled) { box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.5); }
.btn-light { min-height: 44px; padding: 4px 8px; color: var(--gold); background: none; font-size: 14px; }
.btn-light:hover:not(:disabled) { color: var(--gold-hi); }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-row { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.btn-row .btn-light + .btn-light { box-shadow: -1px 0 0 var(--hair); border-radius: 0; }

/* Лента сцены (как «Ночь пройдена») */
.ribbon { position: relative; display: grid; place-items: center; gap: 6px; width: min(340px, 100%); margin: 0 auto; padding: 12px 22px 13px;
  background: linear-gradient(90deg, rgb(6 5 22 / 0), rgb(6 5 22 / 0.94) 14%, rgb(6 5 22 / 0.94) 86%, rgb(6 5 22 / 0)); }
.ribbon::before, .ribbon::after { content: ''; position: absolute; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, rgb(255 230 168 / 0.9), transparent); }
.ribbon::before { top: 0; } .ribbon::after { bottom: 0; }
.ribbon b { font: 400 24px/1.05 var(--font-display); letter-spacing: 0.18em; padding-left: 0.18em; text-transform: uppercase; color: #fff6e0; text-align: center; text-shadow: 0 0 12px rgb(var(--gold-rgb) / 0.45); text-wrap: balance; }
.ribbon small { font: 700 12.5px/1.35 var(--font-body); letter-spacing: 0.03em; color: #f2dfb6; text-align: center; text-wrap: balance; }
.ribbon.pop { animation: unfurl 0.7s cubic-bezier(.16,1,.3,1) both; }
@keyframes unfurl { from { clip-path: inset(0 50% 0 50%); opacity: 0.4; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.toast-layer { position: absolute; left: 0; right: 0; top: 38%; z-index: 30; pointer-events: none; display: grid; justify-items: center; }
.toast-layer .ribbon { transition: opacity 0.5s ease; }

/* Строки (как итоги ночи) */
.rows { display: grid; }
.rows .r { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 2px; color: var(--ink-dim); font-size: 14px; }
.rows .r + .r { box-shadow: 0 -1px 0 var(--hair); }
.rows .r b { color: var(--ink); font-weight: 700; text-align: right; }
.rows .r.total { box-shadow: 0 -1px 0 rgb(var(--gold-rgb) / 0.55); color: var(--gold-hi); font-weight: 700; }

/* Суть идеи: строки справа от прототипа */
.aside h2 { margin: 0 0 4px; font: 400 13px/1 var(--font-display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-hi); }
.facts { display: grid; gap: 0; margin: 0 0 22px; }
.fact { display: grid; grid-template-columns: 142px minmax(0, 1fr); gap: 14px; padding: 12px 0; }
.fact + .fact { box-shadow: 0 -1px 0 var(--hair); }
.fact > span { font: 800 11px/1.5 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); padding-top: 1px; }
.fact > div { color: var(--ink); font-size: 14px; line-height: 1.55; text-wrap: pretty; }
.fact > div i { font-style: normal; color: var(--ink-dim); }
.tasks { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.tasks li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13.5px; color: var(--ink); }
.tasks li + li { box-shadow: 0 -1px 0 var(--line); }
.tasks li code { font: 800 11.5px/1.6 var(--font-body); letter-spacing: 0.06em; color: var(--gold); }
@media (max-width: 520px) { .fact { grid-template-columns: 1fr; gap: 2px; } }

/* Лестница открытия (полоса на каждой витрине) */
.ladder { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; gap: 0; position: relative; padding: 8px 0 0; }
.ladder::before { content: ''; position: absolute; left: 4%; right: 4%; top: 24px; height: 1px; background: linear-gradient(90deg, rgb(var(--gold-rgb) / 0.5), rgb(var(--gold-rgb) / 0.12)); }
.ladder .st { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; }
.ladder .st i { width: 12px; height: 12px; margin-top: 10px; border-radius: 50%; background: #2a2650; box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.35); }
.ladder .st.past i { background: radial-gradient(circle at 40% 35%, #fff3c4, #f6c25b 55%, #b9791b); box-shadow: 0 0 8px rgb(var(--gold-rgb) / 0.6); }
.ladder .st.here i { width: 20px; height: 20px; margin-top: 6px; background: radial-gradient(circle at 40% 35%, #fff, #ffe6a8 40%, #f6c25b 75%); box-shadow: 0 0 0 4px rgb(var(--gold-rgb) / 0.18), 0 0 18px rgb(var(--gold-rgb) / 0.9); }
.ladder .st small { font: 700 10.5px/1.25 var(--font-body); color: var(--ink-faint); max-width: 76px; text-wrap: balance; }
.ladder .st.here small { color: var(--gold-hi); }
@media (max-width: 720px) { .ladder .st small { display: none; } .ladder .st.here small { display: block; position: absolute; top: 34px; white-space: nowrap; } .ladder { padding-bottom: 26px; } }
.ladder-note { margin: 10px 0 0; color: var(--ink-dim); font-size: 13.5px; text-align: center; text-wrap: balance; }
.ladder-note b { color: var(--gold-hi); }

/* Карты и знаки игры */
.k-card { position: relative; flex: none; }
.k-card > img { position: absolute; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.k-sig { flex: none; display: block; }
.k-body-mark { position: absolute; pointer-events: none; }

/* Небо 4×4 */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 330px; margin: 0 auto; }
.cell { position: relative; aspect-ratio: 0.7; border-radius: 9px; background: rgb(255 255 255 / 0.025); box-shadow: inset 0 0 0 1px rgb(170 160 255 / 0.16); }
.cell.can { box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.45); cursor: pointer; }
.cell .k-card { position: absolute; inset: 0; }

/* Рука */
.hand { display: flex; justify-content: center; gap: 8px; }
.hand .slot { cursor: pointer; transition: transform 0.18s cubic-bezier(.2,.9,.3,1.2); }
.hand .slot.sel { transform: translateY(-10px); filter: drop-shadow(0 0 10px rgb(var(--gold-rgb) / 0.7)); }

/* Формула */
.formula { display: flex; justify-content: center; align-items: center; gap: 8px; }
.plate { min-width: 74px; padding: 7px 10px; border-radius: 12px; text-align: center; font: 800 20px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.plate small { display: block; margin-top: 4px; font: 800 10px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
.plate.l { color: var(--light); background: rgb(var(--light-rgb) / 0.08); box-shadow: inset 0 0 0 1px rgb(var(--light-rgb) / 0.5); }
.plate.m { color: var(--mult); background: rgb(var(--mult-rgb) / 0.08); box-shadow: inset 0 0 0 1px rgb(var(--mult-rgb) / 0.5); }
.plate.s { color: var(--gold-hi); background: rgb(var(--gold-rgb) / 0.06); box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.45); }
.formula .x { color: var(--ink-faint); font: 800 16px/1 var(--font-body); }

/* Подсказка-плитка без плашки */
.hintline { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-dim); font: 600 13px/1.35 var(--font-body); text-align: center; }

/* Плавное появление */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise 0.45s cubic-bezier(.16,1,.3,1) both; }
@keyframes flare { 0% { filter: brightness(1); } 35% { filter: brightness(1.9) drop-shadow(0 0 14px rgb(255 230 168 / 0.95)); } 100% { filter: brightness(1); } }
.flare { animation: flare 0.9s ease-out both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

.foot { margin-top: 48px; text-align: center; color: var(--ink-faint); font-size: 12px; }

</style>
<style>
.pick-mid { flex: 1; display: grid; align-content: center; gap: 12px; }
.lineview { flex: 1; }
.pline .ico svg, .pline .k-sig, .pline > svg { width: 28px !important; height: 28px !important; }
em { font-style: normal; }
.scroll { position: relative; display: grid; gap: 6px; padding: 16px 14px 12px; border-radius: 18px;
  background: radial-gradient(120% 90% at 50% 0%, rgb(var(--gold-rgb) / 0.08), transparent 70%), rgb(10 9 30 / 0.78); box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.3); }
.scroll::before, .scroll::after { content: ''; position: absolute; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgb(255 230 168 / 0.7), transparent); }
.scroll::before { top: 0; } .scroll::after { bottom: 0; }
.scroll .cap { text-align: center; font: 400 12px/1 var(--font-display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-hi); margin-bottom: 4px; }
.pro { display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; border: 0; background: none; text-align: left; cursor: pointer; transition: box-shadow 0.2s ease, background 0.2s ease; }
.pro.on { background: rgb(14 12 34 / 0.7); box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.5); }
.pro b { display: block; font: 700 14.5px/1.25 var(--font-body); color: var(--ink); }
.pro small { display: block; margin-top: 3px; font: 600 12.5px/1.3 var(--font-body); color: var(--ink-dim); }
.pro small em { font-style: normal; color: var(--gold-hi); font-weight: 700; }
.pro .ico, .bk .ico { width: 44px; height: 44px; display: grid; place-items: center; }

/* Рама ночи со свитком */
.nframe { display: grid; gap: 10px; padding: 12px 14px; border-radius: 18px; background: rgb(10 9 30 / 0.72); box-shadow: inset 0 0 0 1px rgb(var(--gold-rgb) / 0.3); }
.nframe .row1 { display: flex; justify-content: space-between; align-items: baseline; }
.nframe .row1 span { font: 400 12px/1 var(--font-display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-hi); }
.nframe .row1 b { font: 800 24px/1 var(--font-body); color: #fff6e0; font-variant-numeric: tabular-nums; }
.pline { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-top: 10px; box-shadow: 0 -1px 0 var(--hair); }
.pline .t { font: 600 12.5px/1.3 var(--font-body); color: var(--ink-dim); }
.pline .t b { color: var(--ink); font-weight: 700; }
.pline .n { font: 800 13px/1 var(--font-body); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 3px; border-radius: 3px; background: rgb(var(--gold-rgb) / 0.14); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #e09a2f, #ffe6a8); box-shadow: 0 0 8px rgb(var(--gold-rgb) / 0.8); transition: width 0.6s cubic-bezier(.16,1,.3,1); }
.nframe.done { animation: flare 1s ease-out both; }
.nframe.done .pline .t b { color: var(--gold-hi); }

.lineview { display: grid; justify-items: center; gap: 8px; min-height: 150px; align-content: center; }
.lineview .cards { display: flex; gap: 6px; }
.lineview .nm { font: 400 18px/1 var(--font-display); letter-spacing: 0.2em; text-transform: uppercase; color: #fff6e0; }
.lineview .nm.hit { color: var(--gold-hi); text-shadow: 0 0 12px rgb(var(--gold-rgb) / 0.7); }
.lineview .pts { font: 700 13px/1 var(--font-body); color: var(--ink-dim); }
.reward { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 12px; padding: 4px 4px; }
.reward b { display: block; color: var(--gold-hi); font: 700 14.5px/1.2 var(--font-body); }
.reward small { display: block; color: var(--ink-dim); font: 600 12.5px/1.3 var(--font-body); margin-top: 3px; }

/* Книга пророчеств */
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 22px; }
.bk { display: grid; grid-template-columns: 44px minmax(0, 1fr) 36px; align-items: center; gap: 12px; padding: 9px 0; box-shadow: 0 -1px 0 var(--hair); }
.bk b { display: block; font: 700 13.5px/1.25 var(--font-body); color: var(--ink-dim); }
.bk small { display: block; margin-top: 2px; font: 600 11.5px/1.3 var(--font-body); color: var(--ink-faint); }
.bk.got b { color: var(--gold-hi); }
.bk.got small { color: var(--ink-dim); }
.bk:not(.got) .ico, .bk:not(.got) .rw { opacity: 0.45; filter: grayscale(0.7); }
.bk .rw { justify-self: end; }
.bk.fresh { animation: flare 1s ease-out both; }
</style>
</head>
<body>
<div class="wrap">
  <div class="split">
    <div>
      <div class="stage" id="stage">
        <div class="stage-inner" id="inner"></div>
      </div>
    </div>
    <div class="aside" id="aside"></div>
  </div>
  <div class="label">Книга пророчеств <small>16 первой волны · исполненные хоть раз — золотом</small></div>
  <div class="book" id="book"></div>
  <div class="label">Когда открывается</div>
  <div id="ladder"></div>
  <p class="foot">Витрина 0.7 · Пророчества · 21.10.2026 · прототип, правила и числа — черновик</p>

  const i = VITRINES.findIndex((v) => v.id === id);
  const v = VITRINES[i];
  const prev = VITRINES[(i - 1 + VITRINES.length) % VITRINES.length];
  const next = VITRINES[(i + 1) % VITRINES.length];
  const nav = h('nav', { class: 'vt-nav' },
    id === 'index' ? h('span', { class: 'pg' }, 'Релиз 0.7 «Глубина»') : h('a', { href: 'd8-index.html' }, icon('grid'), 'План релиза'),
    h('span', { class: 'sp' }),
    h('a', { href: prev.file, 'aria-label': 'Предыдущая' }, icon('back')),
    h('span', { class: 'pg num' }, `${i + 1} / ${VITRINES.length}`),
    h('a', { href: next.file, 'aria-label': 'Следующая' }, icon('next')));
  const top = h('header', { class: 'top' }, h('h1', {}, v.title), h('div', { class: 'sill' }), lead ? h('p', { html: lead }) : null);
  const wrap = q('.wrap') || document.body.appendChild(h('div', { class: 'wrap' }));
  wrap.prepend(nav, top);
  document.title = `${v.title} · Starweave ${v.release ?? '0.7'}`;
  return v;
}
/** Полоса «где на лестнице открытия». */
function ladder(el, step) {
  const row = h('div', { class: 'ladder' });
  LADDER.forEach(([name], i) => row.append(h('div', { class: 'st' + (i < step ? ' past' : i === step ? ' here' : '') }, h('i'), h('small', {}, name))));
  const [name, when, what] = LADDER[step];
  el.append(row, h('p', { class: 'ladder-note', html: step ? `Ступень ${step} из 11 · <b>${name}</b>: ${what}. Открывается — <b>${when}</b>.` : `<b>${name}</b> — первый забег: ${what}. Дальше по ступени за дело игрока.` }));
}
/** Блок «суть»: строки подпись — текст и задачи эпика. */
function facts(el, rows, tasks) {
  el.append(h('div', { class: 'facts' }, rows.map(([k, v]) => h('div', { class: 'fact' }, h('span', {}, k), h('div', { html: v })))));
  if (tasks) el.append(h('h2', {}, 'Задачи'), h('ul', { class: 'tasks' }, tasks.map(([c, t]) => h('li', {}, h('code', {}, c), h('span', { html: t })))));
}

/* ───────── Сид для повторяемых раскладов ───────── */
function rng(seed = 1) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32);
}
const shuffle = (a, r = random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  { id: 'noShop', icon: 'shop', name: 'Глава без покупок', reward: 'omen-prismLens', rName: 'Знамение даром' },

/* Ночь по шагам: линии, что вспыхивают на ходах. hit — засчитывается пророчеству. */
const SCRIPT = {
  flush2: [
    { cards: [[3, 'sun'], [3, 'moon'], [7, 'star'], [5, 'comet']], nm: 'Пара', pts: 168 },
    { cards: [[2, 'moon'], [9, 'moon'], [4, 'moon'], [6, 'moon']], nm: 'Флеш', pts: 976, hit: true },
    { cards: [[5, 'sun'], [3, 'moon'], [6, 'star'], [4, 'comet']], nm: 'Стрит', pts: 672 },
    { cards: [[1, 'star'], [8, 'star'], [5, 'star'], [7, 'star']], nm: 'Флеш', pts: 1144, hit: true },
  ],
  lastCross: [
    { cards: [[4, 'sun'], [8, 'moon'], [4, 'star'], [8, 'comet']], nm: 'Две пары', pts: 368 },
    { cards: [[7, 'sun'], [7, 'moon'], [2, 'star'], [7, 'comet']], nm: 'Тройка', pts: 639 },
    { cards: [[6, 'moon'], [4, 'moon'], [7, 'moon'], [5, 'moon']], nm: 'Последний ход · крест ×2', pts: 4256, hit: true },
  ],
};
let S;
const stage = sky(q('#stage'), 4);
const inner = q('#inner');

function start() { S = { phase: 'pick', pick: OFFER[0], step: 0, prog: 0, score: 0 }; draw(); }
function draw() {
  if (S.phase === 'pick') return drawPick();
  drawNight();
}
function drawPick() {
  inner.replaceChildren(
    h('div', { class: 'stage-head rise' }, h('div', { class: 'plate-title' }, 'Глава 4'), h('div', { class: 'plate-sub' }, 'Небо даёт пророчество на три ночи')),
    h('div', { class: 'pick-mid' }, h('div', { class: 'scroll rise' }, h('div', { class: 'cap' }, 'Выбери одно'),
      ...OFFER.map((id) => { const p = by(id); return h('button', { class: 'pro' + (S.pick === id ? ' on' : ''), onclick: () => { S.pick = id; draw(); } },
        h('span', { class: 'ico' }, ico(p.icon)), h('span', {}, h('b', {}, p.name), h('small', { html: `Награда: <em>${p.rName}</em>` })), reward(p.reward)); })),
    h('div', { class: 'stage-note' }, 'Второе пророчество сгорит — выбирай под свою сборку')),
    h('div', { class: 'stage-foot' }, h('button', { class: 'btn btn-primary', onclick: () => { S.phase = 'night'; draw(); } }, 'Принять пророчество')));

      h('div', { class: 'bar' }, h('i', { style: { width: (S.prog / goal) * 100 + '%' } }))));
}
function drawNight(last) {
  const p = by(S.pick), steps = SCRIPT[S.pick];
  const view = h('div', { class: 'lineview' });
  if (last) view.append(h('div', { class: 'cards rise' }, ...last.cards.map(([r, s]) => card({ rank: r, suit: s }, 58))),
    h('div', { class: 'nm' + (last.hit ? ' hit' : '') }, last.nm), h('div', { class: 'pts num' }, `+${last.pts.toLocaleString('ru-RU')} очков`));
  else view.append(h('div', { class: 'hintline' }, 'Ночь идёт: каждый ход — вспышка линии'));

  inner.replaceChildren(frameEl(), view, foot);
}
async function nextMove() {
  const steps = SCRIPT[S.pick], st = steps[S.step];
  S.step++;
  const before = S.score;
  S.score += st.pts;
  if (st.hit) S.prog++;
  const goal = by(S.pick).goal || 1;
  const fulfilled = S.prog >= goal;
  drawNight(st);
  countUp(q('#sc'), before, S.score, 600);
  if (fulfilled) {
    await wait(REDUCED ? 30 : 700);
    S.phase = 'done';
    const fresh = !got.has(S.pick);
    got.add(S.pick);
    drawNight(st);
    renderBook(fresh ? S.pick : null);
    ribbon(stage, 'Сбылось', by(S.pick).rName, 1900);
  }
}
