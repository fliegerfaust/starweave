<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дар ночи · Starweave 0.8</title>
<!--KIT-->
<style>
#view { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.won-gold { display: flex; align-items: center; justify-content: center; gap: 12px; font: 800 56px/1 var(--font-body); color: var(--gold-hi); text-shadow: 0 0 30px rgb(var(--gold-rgb) / 0.55); font-variant-numeric: tabular-nums; }
.coin { flex: none; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #f6c25b 45%, #b9791b); box-shadow: 0 0 16px rgb(var(--gold-rgb) / 0.7); }
.coin.sm { width: 16px; height: 16px; box-shadow: 0 0 6px rgb(var(--gold-rgb) / 0.6); }
.fan { position: relative; height: 196px; display: flex; justify-content: center; align-items: flex-end; margin-top: 4px; }
.fan .opt { position: relative; margin: 0 -6px; cursor: pointer; transform-origin: 50% 120%; transition: transform 0.35s cubic-bezier(.2,.9,.3,1.15), filter 0.3s ease; animation: deal 0.6s cubic-bezier(.16,1,.3,1) both; }
.fan .opt:nth-child(1) { --rot: -9deg; --dy: 12px; animation-delay: 0.05s; }
.fan .opt:nth-child(2) { --rot: 0deg; --dy: 0px; animation-delay: 0.15s; z-index: 2; }
.fan .opt:nth-child(3) { --rot: 9deg; --dy: 12px; animation-delay: 0.25s; }
.fan .opt { transform: translateY(var(--dy)) rotate(var(--rot)); }
.fan .opt.sel { transform: translateY(-14px) rotate(0deg) scale(1.08); z-index: 3; filter: drop-shadow(0 0 16px rgb(var(--gold-rgb) / 0.75)); }
.fan.has-sel .opt:not(.sel) { filter: brightness(0.6) saturate(0.7); }
@keyframes deal { from { opacity: 0; transform: translateY(80px) rotate(0deg) scale(0.8); } }
.fan .up { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); white-space: nowrap; font: 800 12px/1 var(--font-body); color: var(--gold-hi); letter-spacing: 0.04em; }
.detail { min-height: 112px; display: grid; justify-items: center; align-content: start; gap: 6px; text-align: center; padding-top: 18px; }
.detail b { font: 700 15.5px/1.2 var(--font-body); color: var(--gold-hi); }
.detail span { max-width: 290px; color: var(--ink); font-size: 14px; line-height: 1.45; text-wrap: balance; }
.detail span i { font-style: normal; color: var(--ink-dim); }
.detail .kind { font: 800 10.5px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
.asc { display: flex; align-items: center; gap: 10px; }
.asc svg { width: 26px; height: 16px; color: var(--gold); }
.btn .coin.sm { margin-left: 2px; }
.btn .plus { font-variant-numeric: tabular-nums; }
.board { position: relative; width: 100%; max-width: 268px; margin: 0 auto; }
.board .grid4 { max-width: 268px; }
.cell.target { box-shadow: inset 0 0 0 1.5px rgb(255 230 168 / 0.8); animation: pulse 1.4s ease-in-out infinite; cursor: pointer; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 1.5px rgb(255 230 168 / 0.3), 0 0 16px rgb(var(--gold-rgb) / 0.35); } }
.cell .k-card { transition: opacity 0.4s ease, transform 0.5s cubic-bezier(.4,0,.2,1), filter 0.3s; }
.cell .k-card.out { opacity: 0; transform: scale(0.7) translateY(-16px); }
.cell .k-card.knock { opacity: 0; transform: translate(70px, -90px) rotate(28deg) scale(0.7); }
.cell .k-card.keep { filter: drop-shadow(0 0 12px rgb(234 246 255 / 0.95)); }
.cell .k-card.sink { opacity: 0; transform: scale(0.1) rotate(180deg); transition-duration: 0.9s; }
.cell.line-flare { animation: flare 0.8s ease-out both; }
.hand1 { display: flex; justify-content: center; min-height: 92px; }
.hand1 .k-card { filter: drop-shadow(0 0 10px rgb(var(--gold-rgb) / 0.6)); transform: translateY(-6px); }
.combo-name { text-align: center; min-height: 20px; font: 700 14px/1.2 var(--font-body); color: var(--gold-hi); }
.pulse-meter { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-dim); font: 600 12.5px/1 var(--font-body); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 22px; }
.body-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; box-shadow: 0 -1px 0 var(--hair); }
.body-row b { display: block; font: 700 14.5px/1.2 var(--font-body); color: var(--gold-hi); }
.body-row small { display: block; margin-top: 4px; font: 500 13px/1.4 var(--font-body); color: var(--ink); text-wrap: pretty; }
.body-row em { display: block; margin-top: 3px; font: 600 11.5px/1.3 var(--font-body); font-style: normal; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="split">
    <div>
      <div class="stage" id="stage">
        <div class="stage-inner" id="view"></div>
      </div>
    </div>
    <div class="aside" id="aside"></div>
  </div>
  <div class="label">Небесные тела <small>первая волна · 6 тел · открываются на ступени 3</small></div>
  <div class="gallery" id="gallery"></div>
  <div class="label">Когда открывается</div>
  <div id="ladder"></div>
  <p class="foot">Витрина 0.8 · Дар ночи · 21.10.2026 · прототип, правила и числа — черновик</p>
</div>
<!--KITJS-->
<script>
shell({ id: 'gift', lead: 'После победной ночи — <b>звезда в колоду на выбор</b>: карта с глифом, небесное тело или повышение ранга. Или «чистое небо» и золото: тонкая колода — тоже стратегия.' });
const stage = sky(q('#stage'), 2); /* art: nebula-2 · card-moon-8-blazing */
const view = q('#view');
const BODY_ORDER = ['polaris', 'meteor', 'pulsar', 'twin', 'nebula', 'blackhole'];
const BODY_CARD = { polaris: { suit: 'sun', rank: 5 }, meteor: { suit: 'comet', rank: 6 }, pulsar: { suit: 'star', rank: 4 }, twin: { suit: 'moon', rank: 4 }, nebula: { suit: 'star', rank: 7 }, blackhole: { suit: 'comet', rank: 3 } };
const BODY_WHY = {
  polaris: 'Собирай линии вокруг неё: каждая вспышка — без потери места',
  meteor: 'Чистит небо от лишней карты без сжигания',
  pulsar: 'Ставь в центр: копит множитель от каждой вспышки рядом',
  twin: 'Одна карта — две пары. Дружит с Двойной звездой',
  nebula: 'Закрывает любую почти готовую линию',
  blackhole: 'Разовый взрыв, а колода становится тоньше',
};
let bodyIdx = 0, choice = null, gold = 14;

/* ── Подсчёт линии — таблица созвездий игры ── */
const COMBO = { scatter: ['Россыпь', 5, 1], pair: ['Пара', 10, 2], twoPair: ['Две пары', 20, 2], triple: ['Тройка', 30, 3], straight: ['Стрит', 30, 4], flush: ['Флеш', 35, 4], cascade: ['Каскад', 50, 5], quartet: ['Квартет', 60, 7], starFlush: ['Звёздный флеш', 100, 8], supernova: ['Сверхновая', 150, 10] };
function evalLine(cs) {
  const rs = cs.map((c) => c.rank), ranks = [...rs].sort((a, b) => a - b);
  const counts = Object.values(ranks.reduce((o, r) => ((o[r] = (o[r] || 0) + 1), o), {})).sort((a, b) => b - a);
  const flush = cs.every((c) => c.suit === cs[0].suit);
  const straight = new Set(ranks).size === 4 && ranks[3] - ranks[0] === 3;
  const cascade = rs.every((r, i) => !i || r === rs[i - 1] + 1);
  const id = cascade && flush ? 'supernova' : straight && flush ? 'starFlush' : counts[0] === 4 ? 'quartet' : cascade ? 'cascade' : flush ? 'flush' : straight ? 'straight' : counts[0] === 3 ? 'triple' : counts[0] === 2 && counts[1] === 2 ? 'twoPair' : counts[0] === 2 ? 'pair' : 'scatter';
  const [name, base, mult] = COMBO[id];
  return { id, name, light: base + rs.reduce((a, b) => a + b, 0), mult };
}

/* ── Варианты дара ── */
function options() {
  const b = BODY_ORDER[bodyIdx];
  return [
    { kind: 'glyph', card: { suit: 'moon', rank: 8, glyph: 'blazing' }, name: '8 Луны с Пламенем', rule: 'Карта с глифом: <span class="c-mult">+4</span> к множителю, когда вспыхивает', tag: 'Глиф' },
    { kind: 'body', body: b, card: { ...BODY_CARD[b], body: b }, name: BODIES[b].name, rule: `${BODIES[b].rule}<br><i>${BODY_WHY[b]}</i>`, tag: 'Небесное тело' },
    { kind: 'ascend', card: { suit: 'star', rank: 7 }, from: { suit: 'star', rank: 6 }, name: 'Возвышение', rule: '6 Звезды в колоде становится <b>7</b> — до Каскада одной карты', tag: 'Ранг +1' },
  ];
}

/* ── 1. Ночь пройдена ── */
async function showWon() {
  choice = null;
  view.replaceChildren(
    h('div', { class: 'stage-head' }, h('div', { class: 'plate-title' }, 'Глава II · Полночь')),
    h('div', { style: { flex: '1', display: 'grid', alignContent: 'center', gap: '18px' } },
      h('div', { class: 'ribbon pop' }, h('b', {}, 'Ночь пройдена'), h('small', {}, '2 310 очков при цели 1 400')),
      h('div', { class: 'won-gold' }, h('span', { class: 'coin' }), h('span', { id: 'wg' }, '+0')),
      h('div', { class: 'rows', style: { width: 'min(300px, 100%)', margin: '0 auto' } },
        h('div', { class: 'r' }, 'За ночь', h('b', { class: 'num' }, '+4')),
        h('div', { class: 'r' }, 'Ходы в запасе · 6', h('b', { class: 'num' }, '+2')),
        h('div', { class: 'r' }, 'Проценты', h('b', { class: 'num' }, '+2')),
        h('div', { class: 'r total' }, 'Итого', h('b', { class: 'num' }, '+8')))),
    h('div', { class: 'stage-foot' }, h('button', { class: 'btn btn-primary', onclick: showGift }, 'Забрать')));
  countUp(q('#wg'), 0, 8, 800, (n) => '+' + n);
}

/* ── 2. Дар ночи ── */
function showGift() {
  const opts = options();
  const fan = h('div', { class: 'fan' });
  const detail = h('div', { class: 'detail' }, h('span', { html: '<i>Коснись звезды, чтобы рассмотреть</i>' }));
  const take = h('button', { class: 'btn btn-primary', disabled: true, onclick: () => choice && showSky(choice) }, 'Взять в колоду');
  opts.forEach((o, i) => {
    const el = h('div', { class: 'opt', onclick: () => select(i) }, card(o.card, 92));
    if (o.kind === 'ascend') el.append(h('span', { class: 'up' }, '6 → 7'));
    fan.append(el);
  });
  function select(i) {
    choice = opts[i];
    fan.classList.add('has-sel');
    [...fan.children].forEach((c, j) => c.classList.toggle('sel', i === j));
    const o = opts[i];
    detail.replaceChildren(h('div', { class: 'kind' }, o.tag), h('b', {}, o.name), h('span', { html: o.rule }));
    if (o.kind === 'ascend') detail.append(h('div', { class: 'asc' }, card(o.from, 36), svg('<path d="M2 8h20m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>', 26, 16), card(o.card, 36)));
    take.disabled = false;
  }
  view.replaceChildren(
    h('div', { class: 'stage-head' }, h('div', { class: 'plate-title' }, 'Дар ночи'), h('div', { class: 'plate-sub' }, 'Одна звезда в колоду — или чистое небо')),
    fan, detail,
    h('div', { class: 'stage-foot' }, take,
      h('button', { class: 'btn btn-secondary', onclick: showSkip }, 'Чистое небо', h('span', { class: 'plus' }, '+2'), h('span', { class: 'coin sm' })),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn btn-light', onclick: () => { bodyIdx = (bodyIdx + 1) % BODY_ORDER.length; showGift(); } }, 'Другое тело в даре'))));
}

/* ── Пропуск: золото ── */
async function showSkip() {
  view.replaceChildren(
    h('div', { class: 'stage-head' }, h('div', { class: 'plate-title' }, 'Чистое небо')),
    h('div', { style: { flex: '1', display: 'grid', alignContent: 'center', gap: '16px', justifyItems: 'center' } },
      h('div', { class: 'won-gold' }, h('span', { class: 'coin' }), h('span', { id: 'sg' }, String(gold))),
      h('div', { class: 'plate-sub', style: { maxWidth: '280px' } }, 'Колода не растёт — нужные карты приходят чаще. Золото — в Обсерваторию.')),
    h('div', { class: 'stage-foot' }, h('button', { class: 'btn btn-primary', onclick: showWon }, 'Ещё раз')));
  await wait(300);
  await countUp(q('#sg'), gold, gold + 2, 700);
}

/* ── 3. Взятое — в деле ── */
const C = (suit, rank, extra) => ({ suit, rank, ...extra });
const DEMOS = {
  polaris: { grid: { 4: C('moon', 2), 5: C('star', 3), 6: C('comet', 4), 3: C('sun', 9) }, at: 7,
    run: async (g) => { await ignite(g, [4, 5, 6, 7], { keep: 7 }); note('Линия погасла, а Полярная звезда осталась — и стоит уже в новых линиях'); } },
  meteor: { grid: { 8: C('sun', 3), 9: C('moon', 3), 10: C('star', 9), 7: C('star', 1), 15: C('moon', 8) }, at: 11,
    run: async (g) => { await knock(g, 7); await ignite(g, [8, 9, 10, 11]); note('Метеор выбил лишнюю 1 Звезды — клетка снова свободна, без сжигания'); } },
  pulsar: { grid: { 0: C('sun', 2), 1: C('sun', 6), 3: C('sun', 8), 6: C('moon', 5), 10: C('star', 5), 14: C('comet', 9) }, at: 5,
    run: async (g) => {
      let x = 0; const meter = () => { const m = q('#pm'); if (!m) throw STALE; return m; };
      note('Пульсар в центре. Дальше — ходы рядом с ним');
      await wait(900); await drop(g, 2, C('sun', 4)); await ignite(g, [0, 1, 2, 3]); meter().textContent = '+' + (x += 2); meter().parentElement.classList.add('flare');
      await wait(500); await drop(g, 2, C('moon', 5)); await ignite(g, [2, 6, 10, 14]); meter().textContent = '+' + (x += 2);
      note('Две вспышки рядом — Пульсар копит +4 к множителю до конца ночи'); } },
  twin: { grid: { 12: C('sun', 4), 14: C('star', 5), 15: C('comet', 9) }, at: 13,
    run: async (g) => { await ignite(g, [12, 13, 14, 15], { force: { name: 'Две пары', light: 20 + 22, mult: 2 } }); note('Двойник — и 4, и 5: одна карта закрыла две пары'); } },
  nebula: { grid: { 4: C('sun', 7), 5: C('moon', 7), 6: C('comet', 7) }, at: 7,
    run: async (g) => { await ignite(g, [4, 5, 6, 7], { force: { name: 'Квартет', light: 60 + 28, mult: 7 } }); note('Туманность встала седьмой — Квартет из трёх карт'); } },
  blackhole: { grid: { 8: C('moon', 6), 9: C('sun', 6), 10: C('star', 2) }, at: 11,
    run: async (g) => { await ignite(g, [8, 9, 10, 11], { xmult: 2, sink: 11 }); note('Пара с множителем ×2 — и Чёрная дыра ушла из колоды навсегда'); } },
  glyph: { grid: { 0: C('moon', 2), 1: C('moon', 5), 2: C('moon', 6) }, at: 3,
    run: async (g) => { await ignite(g, [0, 1, 2, 3], { addMult: 4 }); note('Флеш Луны, а Пламя добавило +4 к множителю'); } },
  ascend: { grid: { 4: C('sun', 4), 5: C('moon', 5), 6: C('comet', 6) }, at: 7,
    run: async (g) => { await ignite(g, [4, 5, 6, 7]); note('Возвышенная 7 закрыла Каскад 4·5·6·7'); } },
};
let G = null;
function note(t) { const n = q('#note'); if (!n) throw STALE; n.textContent = t; }
function showSky(o) {
  const key = o.kind === 'body' ? o.body : o.kind;
  const d = DEMOS[key];
  G = { cells: Array(16).fill(null), d, card: o.card };
  for (const [i, c] of Object.entries(d.grid)) G.cells[i] = c;
  const grid = h('div', { class: 'grid4', id: 'grid' });
  view.replaceChildren(
    h('div', { class: 'stage-head' }, h('div', { class: 'plate-title' }, 'Следующая ночь'), h('div', { class: 'plate-sub' }, o.name + ' в руке')),
    h('div', { class: 'board' }, grid),
    h('div', { class: 'combo-name', id: 'cn' }),
    h('div', { class: 'formula', id: 'formula', style: { visibility: 'hidden' } }, h('div', { class: 'plate l' }, h('span', { id: 'fl' }, '0'), h('small', {}, 'свет')), h('span', { class: 'x' }, '×'), h('div', { class: 'plate m' }, h('span', { id: 'fm' }, '0'), h('small', {}, 'множ.'))),
    h('div', { class: 'pulse-meter', style: { visibility: key === 'pulsar' ? 'visible' : 'hidden' } }, 'Пульсар копит', h('span', { class: 'c-mult', id: 'pm' }, '+0'), 'к множителю'),
    h('div', { class: 'stage-foot' }, h('div', { class: 'hand1', id: 'hand1' }, card(o.card, 64)), h('div', { class: 'stage-note', id: 'note' }, 'Положи карту в светящуюся клетку'),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn btn-light', onclick: showGift }, 'Другой дар'), h('button', { class: 'btn btn-light', onclick: showWon }, 'Сначала'))));
  renderGrid();
}
function cw() { return round((min(268, q('#grid')?.clientWidth || 268) - 18) / 4); }
function renderGrid() {
  const w = cw();
  q('#grid').replaceChildren(...G.cells.map((c, i) => {
    const cell = h('div', { class: 'cell' + (!c && i === G.d.at && !G.done ? ' target' : ''), onclick: () => i === G.d.at && !G.done && !G.busy && play() });
    if (c) cell.append(card(c, w));
    return cell;
  }));
}
async function play() {
  G.busy = true;
  G.cells[G.d.at] = G.card;
  q('#hand1').replaceChildren();
  renderGrid();
  await wait(350);
  const g = G;
  try { await g.d.run(g); } catch (e) { if (e !== STALE) throw e; return; }
  g.done = true;
  g.busy = false;
}
const STALE = Symbol('stale');
/** Клетка неба; если игрок ушёл с этой сцены посреди показа — показ тихо обрывается. */
const cellEl = (i) => { const grid = q('#grid'); if (!grid) throw STALE; return grid.children[i]; };
async function drop(g, i, c) { g.cells[i] = c; cellEl(i).replaceChildren(card(c, cw())); cellEl(i).firstChild.classList.add('rise'); await wait(450); }
async function knock(g, i) {
  const k = cellEl(i).querySelector('.k-card');
  cellEl(g.d.at).classList.add('line-flare');
  k.classList.add('knock');
  await wait(650);
  g.cells[i] = null;
  cellEl(i).replaceChildren();
}
async function ignite(g, line, opt = {}) {
  const cs = line.map((i) => g.cells[i]);
  const r = opt.force || evalLine(cs);
  const mult = (r.mult + (opt.addMult || 0)) * (opt.xmult || 1);
  line.forEach((i) => cellEl(i).classList.remove('line-flare'));
  void q('#grid').offsetWidth;
  line.forEach((i) => cellEl(i).classList.add('line-flare'));
  q('#formula').style.visibility = 'visible';
  q('#cn').textContent = r.name;
  q('#fl').textContent = r.light;
  q('#fm').textContent = opt.addMult ? r.mult : opt.xmult ? r.mult : mult;
  const fm = () => { const el = q('#fm'); if (!el) throw STALE; return el; };
  if (opt.addMult) { await wait(500); await countUp(fm(), r.mult, mult, 500); }
  if (opt.xmult) { await wait(500); fm().textContent = `${r.mult}×${opt.xmult}`; }
  await wait(700);
  for (const i of line) {
    const k = cellEl(i).querySelector('.k-card');
    if (i === opt.keep) { k.classList.add('keep'); continue; }
    k.classList.add(i === opt.sink ? 'sink' : 'out');
  }
  await wait(opt.sink != null ? 900 : 450);
  for (const i of line) if (i !== opt.keep) { g.cells[i] = null; cellEl(i).replaceChildren(); }
}

/* ── Галерея тел ── */
q('#gallery').append(...BODY_ORDER.map((b) => h('div', { class: 'body-row' }, card({ ...BODY_CARD[b], body: b }, 56), h('div', {}, h('b', {}, BODIES[b].name), h('small', {}, BODIES[b].rule), h('em', {}, BODY_WHY[b])))));

facts(q('#aside'), [
  ['Суть', 'Как награда за бой в Slay the Spire: <b>1 из 3 или пропусти</b>. Сейчас колода меняется только в лавке — теперь каждая победа немного переписывает её.'],
  ['Пропуск', '«Чистое небо» — честная вторая кнопка, а не мелкая ссылка: <span class="c-gold">+2 золота</span> и колода тоньше. Сильные игроки будут пропускать — это тоже сборка.'],
