<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мифы неба · Starweave 0.7</title>
<!--KIT-->
<style>
.board { position: relative; width: 100%; max-width: 330px; margin: 0 auto; }
.board svg.over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.over .ghost { fill: none; stroke: rgb(255 230 168 / 0.55); stroke-width: 1.4; stroke-dasharray: 4 5; animation: dash 1.6s linear infinite; }
.over .ghost-dot { fill: none; stroke: rgb(255 230 168 / 0.8); stroke-width: 1.4; stroke-dasharray: 3 3; }
.over .myth { fill: none; stroke: #fff2cc; stroke-width: 2.2; stroke-linecap: round; filter: drop-shadow(0 0 6px rgb(255 214 120 / 0.9)); stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 0.9s cubic-bezier(.16,1,.3,1) forwards; }
.over .myth-star { fill: #fff6e0; filter: drop-shadow(0 0 6px rgb(255 214 120 / 1)); animation: rise 0.4s ease both; }
@keyframes dash { to { stroke-dashoffset: -18; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell.line-flare { animation: flare 0.8s ease-out both; }
.cell .k-card { transition: opacity 0.35s ease, transform 0.35s ease; }
.cell .k-card.out { opacity: 0; transform: scale(0.7) translateY(-14px); }
.cell.in-myth .k-card { filter: drop-shadow(0 0 10px rgb(255 214 120 / 0.85)); }
.legend { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 40px; }
.legend .fig { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font: 600 12.5px/1.3 var(--font-body); }
.legend .fig b { color: var(--gold-hi); font-weight: 700; }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 18px; }
.myth-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; box-shadow: 0 -1px 0 var(--hair); }
.myth-row b { display: block; font: 700 14px/1.2 var(--font-body); color: var(--ink); }
.myth-row small { display: block; margin-top: 3px; font: 600 12px/1.35 var(--font-body); color: var(--ink-faint); }
.myth-row.found b { color: var(--gold-hi); }
.myth-row.found small { color: var(--ink-dim); }
.mini { width: 56px; height: 56px; }
.mini .d { fill: rgb(170 160 255 / 0.18); }
.mini .s { fill: #4a4580; }
.mini .e { stroke: #4a4580; stroke-width: 1.4; fill: none; }
.myth-row.found .mini .s { fill: #ffe6a8; filter: drop-shadow(0 0 3px rgb(246 194 91 / 0.8)); }
.myth-row.found .mini .e { stroke: rgb(255 230 168 / 0.8); }
.score-line { display: flex; justify-content: center; align-items: baseline; gap: 8px; min-height: 24px; color: var(--ink-dim); font: 600 13px/1 var(--font-body); }
.score-line b { font: 800 20px/1 var(--font-body); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="split">
    <div>
      <div class="stage" id="stage">
        <div class="stage-inner">
          <div class="stage-head">
            <div class="plate-title">Небо · ночь 2</div>
            <div class="score-line">очки <b id="score">0</b></div>
          </div>
          <div class="board" id="board"><div class="grid4" id="grid"></div><svg class="over" id="over"></svg></div>
          <div class="legend" id="legend"></div>
          <div class="formula" id="formula" style="visibility:hidden"><div class="plate l"><span id="fl">0</span><small>свет</small></div><span class="x">×</span><div class="plate m"><span id="fm">0</span><small>множ.</small></div></div>
          <div class="stage-foot">
            <div class="hand" id="hand"></div>
            <div class="stage-note" id="note">Нажми на карту, потом на клетку</div>
            <div class="btn-row"><button class="btn btn-light" id="reset">Сначала</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="aside" id="aside"></div>
  </div>
  <div class="label">Звёздный каталог <small>12 мифов первой волны · найденные — золотом</small></div>
  <div class="catalog" id="catalog"></div>
  <div class="label">Когда открывается</div>
  <div id="ladder"></div>
  <p class="foot">Витрина 0.7 · Мифы неба · 20.10.2026 · прототип, правила и числа — черновик</p>
</div>
<!--KITJS-->
<script>
shell({ id: 'myths', lead: 'Линии — это покер, а небо 4×4 — ещё и <b>рисунок</b>. Карты складываются в фигуру настоящего созвездия — фигура оживает, все её звёзды вспыхивают разом, и миф записывается в каталог.' });

/* Фигуры: клетки [ряд, столбец] в порядке линии созвездия, рёбра — по порядку и доп. */
const MYTHS = [
  { id: 'cassiopeia', name: 'Кассиопея', cells: [[0, 0], [1, 1], [0, 2], [1, 3]], cond: 'suit', x: 3, story: '«W» царицы — четыре звезды зигзагом одной масти' },
  { id: 'pleiades', name: 'Плеяды', cells: [[0, 0], [0, 1], [1, 1], [1, 0]], loop: true, cond: 'rainbow', x: 2, story: 'Сёстры тесным квадратом: все четыре масти' },
  { id: 'corona', name: 'Северная Корона', cells: [[1, 0], [0, 1], [0, 2], [1, 3]], cond: 'rise', x: 3, story: 'Дуга венца: ранги растут слева направо' },
  { id: 'cygnus', name: 'Лебедь', cells: [[0, 1], [1, 1], [2, 1], [3, 1], [1, 0], [1, 2]], edges: [[0, 1], [1, 2], [2, 3], [4, 1], [1, 5]], cond: 'any', x: 4, story: 'Северный крест — шесть звёзд' },
  { id: 'sagitta', name: 'Стрела', cells: [[0, 0], [1, 1], [2, 2], [3, 3]], cond: 'any', x: 2, story: 'Диагональ из угла в угол' },
  { id: 'gemini', name: 'Близнецы', cells: [[0, 0], [1, 0], [2, 0], [0, 2], [1, 2], [2, 2]], edges: [[0, 1], [1, 2], [3, 4], [4, 5], [0, 3]], cond: 'pairs', x: 4, story: 'Две колонны с одинаковыми рангами' },
  { id: 'ursa', name: 'Большой Ковш', cells: [[3, 0], [2, 0], [2, 1], [3, 1], [1, 2], [0, 3]], edges: [[0, 1], [1, 2], [2, 3], [3, 0], [2, 4], [4, 5]], cond: 'any', x: 4, story: 'Ковш и ручка — семь звёзд в небе, шесть на сетке' },
  { id: 'lyra', name: 'Лира', cells: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]], edges: [[0, 1], [1, 2], [1, 3], [3, 4], [4, 2]], cond: 'suit', x: 3, story: 'Вега и струны — пять звёзд одной масти' },
  { id: 'delphinus', name: 'Дельфин', cells: [[0, 1], [1, 0], [2, 1], [1, 2], [3, 2]], edges: [[0, 1], [1, 2], [2, 3], [3, 0], [2, 4]], cond: 'any', x: 3, story: 'Ромб и хвост' },
  { id: 'orion', name: 'Орион', cells: [[0, 0], [0, 3], [1, 1], [1, 2], [3, 0], [3, 3]], edges: [[0, 2], [1, 3], [2, 3], [2, 4], [3, 5]], cond: 'high', x: 5, story: 'Охотник: плечи, пояс и ноги, все ранги 6+' },
  { id: 'scorpius', name: 'Скорпион', cells: [[0, 0], [1, 0], [2, 0], [3, 1], [2, 2], [1, 2]], cond: 'any', x: 4, story: 'Крюк хвоста' },
  { id: 'triangulum', name: 'Треугольник', cells: [[0, 0], [2, 0], [1, 2]], loop: true, cond: 'same', x: 2, story: 'Три звезды одного ранга' },
];
const COND = {
  suit: (cs) => cs.every((c) => c.suit === cs[0].suit),
  rainbow: (cs) => new Set(cs.map((c) => c.suit)).size === 4,
  rise: (cs) => cs.every((c, i) => !i || c.rank > cs[i - 1].rank),
  any: () => true,
  pairs: (cs) => cs.slice(0, 3).every((c, i) => c.rank === cs[i + 3].rank),
  high: (cs) => cs.every((c) => c.rank >= 6),
  same: (cs) => cs.every((c) => c.rank === cs[0].rank),
};
const edgesOf = (m) => m.edges || m.cells.slice(1).map((_, i) => [i, i + 1]).concat(m.loop ? [[m.cells.length - 1, 0]] : []);

/* Все размещения фигуры на 4×4: сдвиги и зеркало по горизонтали */
function placements(m) {
  const out = [];
  for (const flip of [false, true]) {
    const pts = m.cells.map(([r, c]) => [r, flip ? -c : c]);
    const r0 = min(...pts.map((p) => p[0])), c0 = min(...pts.map((p) => p[1]));
    const norm = pts.map(([r, c]) => [r - r0, c - c0]);
    const hgt = max(...norm.map((p) => p[0])), wid = max(...norm.map((p) => p[1]));
    for (let dr = 0; dr + hgt < 4; dr++) for (let dc = 0; dc + wid < 4; dc++) out.push(norm.map(([r, c]) => (r + dr) * 4 + c + dc));
  }
  return out;
}
MYTHS.forEach((m) => (m.place = placements(m)));

/* Подсчёт линии — по таблице созвездий игры */
const COMBO = { scatter: ['Россыпь', 5, 1], pair: ['Пара', 10, 2], twoPair: ['Две пары', 20, 2], triple: ['Тройка', 30, 3], straight: ['Стрит', 30, 4], flush: ['Флеш', 35, 4], quartet: ['Квартет', 60, 7], starFlush: ['Звёздный флеш', 100, 8] };
function evalLine(cs) {
  const ranks = cs.map((c) => c.rank).sort((a, b) => a - b);
  const counts = Object.values(ranks.reduce((o, r) => ((o[r] = (o[r] || 0) + 1), o), {})).sort((a, b) => b - a);
  const flush = cs.every((c) => c.suit === cs[0].suit);
  const straight = new Set(ranks).size === 4 && ranks[3] - ranks[0] === 3;
  const id = straight && flush ? 'starFlush' : counts[0] === 4 ? 'quartet' : flush ? 'flush' : straight ? 'straight' : counts[0] === 3 ? 'triple' : counts[0] === 2 && counts[1] === 2 ? 'twoPair' : counts[0] === 2 ? 'pair' : 'scatter';
  const [name, base, mult] = COMBO[id];
  const light = base + ranks.reduce((a, b) => a + b, 0);
  return { name, light, mult, total: light * mult };
}

/* Расклад: Кассиопея из Лун ждёт одну карту, рядом почти Плеяды и Корона */
const START = {
  grid: { 0: { suit: 'moon', rank: 2 }, 5: { suit: 'moon', rank: 7 }, 7: { suit: 'moon', rank: 4 }, 8: { suit: 'sun', rank: 5 }, 9: { suit: 'star', rank: 3 }, 12: { suit: 'comet', rank: 8 }, 15: { suit: 'star', rank: 6 } },
  hand: [{ suit: 'moon', rank: 9 }, { suit: 'sun', rank: 1 }, { suit: 'star', rank: 5 }, { suit: 'comet', rank: 6 }],
  deck: [{ suit: 'sun', rank: 6 }, { suit: 'moon', rank: 3 }, { suit: 'comet', rank: 2 }, { suit: 'star', rank: 8 }, { suit: 'sun', rank: 9 }, { suit: 'moon', rank: 5 }, { suit: 'comet', rank: 4 }, { suit: 'star', rank: 1 }],
};
const found = new Set();
let S, busy = false;
const stage = sky(q('#stage'), 3); /* art: nebula-3 */
const gridEl = q('#grid'), over = q('#over');

function reset() {
  S = { grid: Array(16).fill(null), hand: START.hand.map((c) => ({ ...c })), deck: START.deck.map((c) => ({ ...c })), sel: null, score: 0, mythsTonight: new Set() };
  for (const [i, c] of Object.entries(START.grid)) S.grid[i] = { ...c };
  q('#score').textContent = '0';
  q('#formula').style.visibility = 'hidden';
  q('#note').textContent = 'Нажми на карту, потом на клетку';
  render();
}
function cardW() { return round((min(330, gridEl.clientWidth || 330) - 18) / 4); }
function render() {
  const w = cardW();
  gridEl.replaceChildren(...S.grid.map((c, i) => {
    const cell = h('div', { class: 'cell' + (!c && S.sel != null ? ' can' : ''), onclick: () => place(i) });
    if (c) cell.append(card(c, w));
    return cell;
  }));
  q('#hand').replaceChildren(...S.hand.map((c, i) => h('div', { class: 'slot' + (S.sel === i ? ' sel' : ''), onclick: () => { if (busy) return; S.sel = S.sel === i ? null : i; render(); } }, card(c, min(64, w)))));
  drawGhosts();
}
function centers() {
  const box = gridEl.getBoundingClientRect(), b0 = q('#board').getBoundingClientRect();
  return [...gridEl.children].map((el) => { const r = el.getBoundingClientRect(); return [r.left - b0.left + r.width / 2, r.top - b0.top + r.height / 2]; });
}
/** Подсказка силуэтом: фигура, которой не хватает одной карты, и в руке есть подходящая. */
function nearMyth() {
  for (const m of MYTHS) for (const pl of m.place) {
    const empty = pl.filter((i) => !S.grid[i]);
    if (empty.length !== 1) continue;
    const fit = S.hand.find((c) => { const cs = pl.map((i) => (i === empty[0] ? c : S.grid[i])); return COND[m.cond](cs); });
    if (fit) return { m, pl, cell: empty[0] };
  }
  return null;
}
function drawGhosts() {
  over.innerHTML = '';
  const near = nearMyth(), legend = q('#legend');
  if (!near) { legend.replaceChildren(); return; }
  const P = centers(), { m, pl, cell } = near;
  let d = '';
  for (const [a, b] of edgesOf(m)) d += `M${P[pl[a]][0]} ${P[pl[a]][1]}L${P[pl[b]][0]} ${P[pl[b]][1]}`;
  over.innerHTML = `<path class="ghost" d="${d}"/><circle class="ghost-dot" cx="${P[cell][0]}" cy="${P[cell][1]}" r="${cardW() * 0.36}"/>`;
  legend.replaceChildren(h('div', { class: 'fig' }, miniSvg(m, 28), h('span', { html: found.has(m.id) ? `Почти <b>${m.name}</b> — не хватает одной звезды` : 'Здесь прячется миф — не хватает одной звезды' })));
}
async function place(i) {
  if (busy || S.sel == null || S.grid[i]) return;
  busy = true;
  const c = S.hand.splice(S.sel, 1)[0];
  S.sel = null;
  S.grid[i] = c;
  if (S.deck.length) S.hand.push(S.deck.shift());
  render();
  // 1. Мифы — до вспышки линий: фигура видна целиком
  for (const m of MYTHS) for (const pl of m.place) {
    if (!pl.includes(i) || pl.some((j) => !S.grid[j]) || S.mythsTonight.has(m.id + pl.join())) continue;
    const cs = pl.map((j) => S.grid[j]);
    if (!COND[m.cond](cs)) continue;
    S.mythsTonight.add(m.id + pl.join());
    await playMyth(m, pl, cs);
  }
  // 2. Линии
  const lines = [];
  for (let k = 0; k < 4; k++) {
    const row = [0, 1, 2, 3].map((x) => k * 4 + x), col = [0, 1, 2, 3].map((x) => x * 4 + k);
    for (const ln of [row, col]) if (ln.includes(i) && ln.every((j) => S.grid[j])) lines.push(ln);
  }
  if (lines.length) await playLines(lines);
  busy = false;
  render();
  if (!S.hand.length) q('#note').textContent = 'Карты кончились — «Сначала», чтобы найти другой миф';
}
async function playMyth(m, pl, cs) {
  const P = centers();
  let d = '';
  for (const [a, b] of edgesOf(m)) d += `M${P[pl[a]][0]} ${P[pl[a]][1]}L${P[pl[b]][0]} ${P[pl[b]][1]}`;
  over.innerHTML = `<path class="myth" d="${d}"/>` + pl.map((j, k) => `<circle class="myth-star" style="animation-delay:${0.15 + k * 0.08}s" cx="${P[j][0]}" cy="${P[j][1]}" r="4"/>`).join('');
  pl.forEach((j) => gridEl.children[j].classList.add('in-myth'));
  const light = cs.reduce((a, c) => a + c.rank, 0) * 5;
  q('#formula').style.visibility = 'visible';
  q('#fl').textContent = light;
  q('#fm').textContent = '×' + m.x;
  const isNew = !found.has(m.id);
  found.add(m.id);
  renderCatalog();
  ribbon(stage, m.name, isNew ? `Новый миф · ${found.size} из ${MYTHS.length}` : `Миф · ×${m.x} к ходу`, 2100);
  q('#note').textContent = m.story;
  await wait(REDUCED ? 50 : 1300);
  const before = S.score;
  S.score += light * m.x;
  await countUp(q('#score'), before, S.score, 600);
  await wait(REDUCED ? 50 : 600);
  over.innerHTML = '';
}
async function playLines(lines) {
  let total = 0, names = [];
  for (const ln of lines) {
    const r = evalLine(ln.map((j) => S.grid[j]));
    total += r.total; names.push(r.name);
    ln.forEach((j) => gridEl.children[j].classList.add('line-flare'));
    q('#formula').style.visibility = 'visible';
    q('#fl').textContent = r.light; q('#fm').textContent = r.mult;
  }
  if (lines.length > 1) total *= lines.length;
  q('#note').textContent = names.join(' + ') + (lines.length > 1 ? ` · крест ×${lines.length}` : '');
  await wait(REDUCED ? 50 : 650);
  for (const ln of lines) ln.forEach((j) => gridEl.children[j].querySelector('.k-card')?.classList.add('out'));
  const before = S.score;
  S.score += total;
  await countUp(q('#score'), before, S.score, 600);
  for (const ln of lines) ln.forEach((j) => (S.grid[j] = null));
}

function miniSvg(m, size = 56) {
  const s = size / 4, P = (k) => [m.cells[k][1] * s + s / 2, m.cells[k][0] * s + s / 2];
  let dots = '';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) dots += `<circle class="d" cx="${c * s + s / 2}" cy="${r * s + s / 2}" r="${s * 0.08}"/>`;
  const e = edgesOf(m).map(([a, b]) => `M${P(a).join(' ')}L${P(b).join(' ')}`).join('');
  const st = m.cells.map((_, k) => `<circle class="s" cx="${P(k)[0]}" cy="${P(k)[1]}" r="${s * 0.17}"/>`).join('');
  const el = svg(`${dots}<path class="e" d="${e}"/>${st}`, size, size);
  el.classList.add('mini');
  el.style.width = el.style.height = size + 'px';
  return el;
}
function renderCatalog() {
  q('#catalog').replaceChildren(...MYTHS.map((m) => {
    const f = found.has(m.id);
    return h('div', { class: 'myth-row' + (f ? ' found' : '') }, miniSvg(m), h('div', {}, h('b', {}, f ? m.name : 'Неизвестный миф'), h('small', {}, f ? `${m.story} · ×${m.x}` : 'Фигура видна, условие откроется находкой')));
  }));
}

facts(q('#aside'), [
  ['Суть', 'Кроме линий есть <b>фигуры</b>: Кассиопея — «W», Плеяды — квадрат, Лебедь — крест. Фигура с условием (масть, порядок, ранги) вспыхивает целиком и даёт <span class="c-mult">×множитель</span> к ходу.'],
  ['Глубина', 'Новое решение каждый ход: закрыть линию сейчас или <b>подождать</b> и достроить фигуру — она съедает клетки сразу нескольких линий. Кресты и мифы складываются.'],
  ['Почему своё', 'Работает только на сетке. В Balatro рука — строка, у StS — нет поля. Подсказка силуэтом — тот же язык, что подписи созвездий на небе сейчас.'],
  ['Коллекция', '12 мифов первой волны, дальше — по партиям на небосводе. Найденный миф — с рисунком и строкой легенды; неизвестный — только силуэт: видно, что искать.'],
  ['Сборки', 'Знамения про мифы: <b>Астролог</b> (+1 к множителю мифа за каждый найденный), <b>Звездочёт</b> (подсказка видна за две карты), <b>Легенда</b> (миф не гасит свои карты).'],
], [
  ['MY.1', 'Ядро: фигуры, сдвиги и зеркала, условия; проверка до вспышки линий'],
  ['MY.2', 'Подсчёт: шаг <i>myth</i> в формуле, ×множитель к ходу'],
  ['MY.3', 'Подсказка силуэтом, рисунок фигуры по звёздам, лента «Новый миф»'],
  ['MY.4', 'Звёздный каталог: 12 силуэтов, находки с легендой'],
  ['MY.5', 'Три Знамения про мифы'],
]);
ladder(q('#ladder'), 5);
q('#reset').onclick = () => !busy && reset();
renderCatalog();
reset();
addEventListener('resize', () => !busy && render());
</script>
</body>
</html>
