<script>
/* art: pack-omen nebula-5 nebula-3 omen-crossroads omen-horizon omen-stardust omen-corona omen-pyre chart-flush ritual-glyph-glass card-moon-9-blazing card-moon-9-radiant card-sun-7-gilded card-sun-8-glass card-star-4-echo card-comet-6-prism card-moon-9 card-sun-8 card-star-4 card-sun-3 card-moon-5 card-star-7 card-comet-2 */

/* Словарь: [вид, название, описание с ключевыми словами] — из строк игры (kw.*, glyphDesc, omen) */
const KW = {
  glass: ['Глиф', 'Стекло', '[Множитель ×2|mult|xmult], пока карта в линии. После хода карта разобьётся с шансом 25%.'],
  blazing: ['Глиф', 'Пламя', '[+4 к множителю|mult|mult], пока карта в линии.'],
  radiant: ['Глиф', 'Сияние', '[+30 света|light|light], пока карта в линии.'],
  gilded: ['Глиф', 'Позолота', '[+2 золота|gold|gold] при каждой вспышке карты.'],
  echo: ['Глиф', 'Эхо', 'Карта засчитывается в линии дважды.'],
  prism: ['Глиф', 'Призма', 'Карта считается любой мастью.'],
  mult: ['Правило', 'Множитель', 'Во сколько раз растут очки созвездия. Очки = [свет|light|light] × множитель.'],
  light: ['Правило', 'Свет', 'База созвездия плюс [ранги|rank] карт линии. Очки = свет × [множитель|mult|mult].'],
  gold: ['Правило', 'Золото', 'Платишь им в Обсерватории и Комете. Приходит за ночи и от глифа [Позолота|gilded].'],
  rank: ['Правило', 'Ранг', 'Число на карте. Прибавляется к [свету|light|light] линии: чем выше ранг, тем больше очков.'],
  level: ['Правило', 'Уровень созвездия', 'Навсегда добавляет созвездию [свет|light|light] и [множитель|mult|mult]. Растёт от звёздных карт.'],
  crossroads: ['Знамение · множитель ×', 'Перекрёсток', 'Множитель цепи +1: крест даёт [множитель ×3|mult|xmult].'],
  horizon: ['Знамение · множитель +', 'Горизонт', 'Вспыхнувший ряд: [+6 к множителю|mult|mult].'],
  stardust: ['Знамение · множитель +', 'Звёздная пыль', 'Каждое созвездие: [+4 к множителю|mult|mult].'],
  pyre: ['Знамение · особое', 'Костёр', '+2 сжигания каждую ночь.'],
  corona: ['Знамение · редкое', 'Корона', 'В Затмение [множитель ×2.5|mult|xmult].'],

function rt(src) {
  src = src.replace(/(^|\s)(\S{1,3}) (\d)/g, '$1$2 $3').replace(/(\d) (\S)/g, '$1 $2');
  const out = []; let last = 0;
  for (const m of src.matchAll(/\[([^|\]]+)\|([^|\]]+)(?:\|([^\]]+))?\]/g)) {
    out.push(src.slice(last, m.index));
    out.push(h('span', { class: 'kw' + (m[3] ? ' c-' + m[3] : ''), 'data-kw': m[2], role: 'button', tabindex: '0' }, m[1]));
    last = m.index + m[0].length;
  }
  out.push(src.slice(last));
  return out;
}

/* Табличка с цепочкой — как в Комете: носик на исходном слове, сторона не меняется, «← назад» */
const hints = new WeakMap();
function closeHint(frame) {
  frame.querySelector('.hint')?.remove();
  frame.querySelectorAll('.kw.on, .on-hint').forEach((k) => k.classList.remove('on', 'on-hint'));
  hints.delete(frame);
}
function openHint(frame, anchor, key) {
  closeHint(frame);
  if (!KW[key]) return;
  anchor.classList.add(anchor.classList.contains('kw') ? 'on' : 'on-hint');
  const st = { anchor, stack: [key], tip: h('div', { class: 'hint' }) };
  hints.set(frame, st);
  frame.append(st.tip);
  paint(frame, 0);
}
function step(frame, key) {
  const st = hints.get(frame); if (!st) return;
  if (key === null) st.stack.pop(); else if (KW[key] && st.stack.at(-1) !== key) st.stack.push(key); else return;
  paint(frame, key === null ? -1 : 1);
}
function paint(frame, dir) {
  const st = hints.get(frame), def = KW[st.stack.at(-1)], prev = st.stack.at(-2);
  const body = h('div', { class: 'body', style: { '--dx': (dir < 0 ? -8 : 8) + 'px', animation: dir ? '' : 'none' } },
    prev ? h('button', { class: 'back', type: 'button', onclick: (e) => { e.stopPropagation(); step(frame, null); } }, '← ' + KW[prev][1]) : null,
    h('small', {}, def[0]), h('b', {}, def[1]), h('p', {}, rt(def[2])));
  st.tip.replaceChildren(body);
  const s = +frame.dataset.scale || 1, fr = frame.getBoundingClientRect(), r = st.anchor.getBoundingClientRect();
  const kx = (r.left - fr.left) / s, ky = (r.top - fr.top) / s, kw = r.width / s, kh = r.height / s;
  const tw = st.tip.offsetWidth, th = st.tip.offsetHeight, FW = frame.offsetWidth, FH = frame.offsetHeight;
  const x = Math.min(FW - tw - 12, Math.max(12, kx + kw / 2 - tw / 2));
  st.below ??= ky + kh + 12 + th + 60 < FH - 12;
  st.tip.classList.toggle('below', st.below); st.tip.classList.toggle('above', !st.below);
  st.tip.style.left = x + 'px';
  st.tip.style.top = (st.below ? ky + kh + 10 : Math.max(12, ky - th - 10)) + 'px';
  st.tip.style.setProperty('--nose', Math.min(tw - 16, Math.max(16, kx + kw / 2 - x)) + 'px');
}
function wire(frame) {
  frame.onclick = (e) => {
    const k = e.target.closest('[data-kw]');
    if (k && k.closest('.hint')) return step(frame, k.dataset.kw);

}

function frameIn(fit, W, H, neb) {

  const scr = h('div', { class: 'scr' });
  frame.append(scr);
  const fs = () => { const s = Math.min(1, fit.clientWidth / W); frame.style.transform = `scale(${s})`; fit.style.height = H * s + 'px'; frame.dataset.scale = s; };
  new ResizeObserver(fs).observe(fit); fs();
  wire(frame);
  return { frame, scr };
}
const sceneTop = (title, gold = '12') => h('div', { class: 'top' }, h('span', { class: 'medal' }, h('i')), h('div', { class: 'ttl' }, title), gold ? h('span', { class: 'gold' }, h('span', { class: 'coin' }), gold) : h('span'));
const coin = () => h('span', { class: 'coin' });

/* ════ Дар ночи ════ */
const GIFTS = [
  { c: { suit: 'moon', rank: 9, glyph: 'radiant' }, name: '9 Луны с [Сиянием|radiant]', rule: '[+30 света|light|light], пока карта в линии' },
  { c: { suit: 'moon', rank: 9, glyph: 'blazing' }, name: '9 Луны с [Пламенем|blazing]', rule: '[+4 к множителю|mult|mult], пока карта в линии' },
  { c: { suit: 'sun', rank: 7, glyph: 'gilded' }, name: '7 Солнца с [Позолотой|gilded]', rule: '[+2 золота|gold|gold] при каждой вспышке карты' },
];
function giftScene(mode, frame) {
  const W = mode === 'desktop' ? 130 : mode === 'landscape' ? 86 : 140;
  let sel = 1;
  const det = h('div', { class: 'gdet' });
  const fan = h('div', { class: 'fan' });
  const paintFan = () => {
    [...fan.children].forEach((s, i) => {
      const off = i - 1;
      s.classList.toggle('sel', i === sel);
      s.style.transform = `translate(${off * W * 0.78}px, ${i === sel ? -10 : 6}px) rotate(${off * 8}deg) scale(${i === sel ? 1.08 : 0.94})`;
      s.style.zIndex = i === sel ? 3 : 1;
    });
    const g = GIFTS[sel];
    det.replaceChildren(h('b', {}, rt(g.name)), h('span', { class: 'ds' }, rt(g.rule)));
  };

const GROWS = [

  [{ suit: 'moon', rank: 9, glyph: 'blazing' }, 'blazing', 'Пламя', '[+4 к множителю|mult|mult]'],

const SCENES = [['gift', 'Дар ночи', giftScene], ['shop', 'Обсерватория', shopScene], ['night', 'Знамение в ночи', nightScene], ['guide', 'Справочник', guideScene]];

  for (const f of frames) {

    f.scr.replaceChildren(...fn(f.mode, f.frame));

}
