# Сервер игры «Звёздное плетение» на общем сервере с «ДенВал.Класс».
#
#   Caddy платформы  →  starweave-api:8080  →  /opt/starweave/data/events.db
#
# Отдельный проект compose (`starweave`) в /opt/starweave: платформа его не видит,
# её деплой его не трогает. С платформой общий только Caddy: его контейнер deploy.sh
# подключает в нашу сеть `starweave_proxy`, где кроме него — один этот контейнер (SEC.3).
# В сети платформы `repo_default` игры нет: из неё не видно ни БД, ни бэкенда платформы. Код не запечён в образ, а лежит рядом
# (./app, только чтение) — Node 24 исполняет TypeScript сам, без сборки.
name: starweave

services:
  api:
    # Образ закреплён по digest (SEC.6): выкладка не подтягивает тихо новый образ.
    # Обновить: digest тега node:24-alpine из Docker Hub — и сюда.
    image: node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    container_name: starweave-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--disable-warning=ExperimentalWarning", "server/src/main.ts"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_PATH: /data/events.db
      # Сайт игры (первым: сводка берёт с него карты исходников) и сборка Пикабу Игр здесь же, /pikabu/
      ALLOWED_ORIGINS: https://fliegerfaust.github.io,https://game.denvalclass.ru
    volumes:
      - ./app:/app:ro
      - ./data:/data
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Жёсткий потолок: что бы ни случилось с игрой, платформе останется её память и процессор
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
      - egress

networks:
  # Caddy ↔ игра. Внутренняя (наружу выхода нет, в интернет — только egress) и внешняя для
  # обоих compose: её создаёт тот, кто поднимается первым, — deploy.sh игры или деплой
  # платформы (`docker network create --internal starweave_proxy`), и никто не удаляет её при `down`
  proxy:
    name: starweave_proxy
    external: true
  # Выход в интернет по IPv6: с этого сервера Bot API Telegram доступен только по IPv6
  # (по IPv4 соединение не устанавливается). Своя сеть проекта — сеть платформы не меняется.
  egress:
    name: starweave_egress
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd5e:a7e0:57a5::/64
