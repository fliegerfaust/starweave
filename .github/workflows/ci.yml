# Проверки на каждый push в любую ветку: типы и тесты. Ничего не публикует —
# деплой живёт в pages.yml и запускается только тегом версии.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Новый push в ветку отменяет прошлый прогон; в main каждый коммит важен
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
