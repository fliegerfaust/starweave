name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Ссылка на Mini App для «Поделиться» в Telegram: gh variable set TG_APP_LINK
          VITE_TG_APP_LINK: ${{ vars.TG_APP_LINK }}
          # Номер счётчика Яндекс Метрики (сайт и Telegram): gh variable set METRIKA_ID
          VITE_METRIKA_ID: ${{ vars.METRIKA_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
