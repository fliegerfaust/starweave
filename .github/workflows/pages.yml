# Деплой на GitHub Pages — только с тега версии `v*`, как в ДенВал.Классе.
# Ветки (release/**, epic/**, feature/**) пушатся свободно: их проверяет ci.yml,
# на боевой они не едут. Релиз мёржится в main, на мёрдж ставится тег — он и выкатывается.
# Ручной запуск — для отката: указать прошлый тег, он соберётся и выкатится заново.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег версии (например v0.5.10)'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # Тег обязан стоять на коммите из main: иначе на боевой уехал бы невлитый релиз
      - name: Тег из main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Ссылка на Mini App для «Поделиться» в Telegram: gh variable set TG_APP_LINK
          VITE_TG_APP_LINK: ${{ vars.TG_APP_LINK }}
          # Номер счётчика Яндекс Метрики (сайт и Telegram): gh variable set METRIKA_ID
          VITE_METRIKA_ID: ${{ vars.METRIKA_ID }}
          # Свой сервер аналитики (server/): gh variable set EVENTS_URL
          VITE_EVENTS_URL: ${{ vars.EVENTS_URL }}
          # Аналитика Telegram Mini Apps: ключ и идентификатор из @DataChief_bot
          VITE_TG_ANALYTICS_TOKEN: ${{ vars.TG_ANALYTICS_TOKEN }}
          VITE_TG_ANALYTICS_APP: ${{ vars.TG_ANALYTICS_APP }}
          # Реклама за награду в Telegram — блок AdsGram: gh variable set ADSGRAM_BLOCK_ID
          VITE_ADSGRAM_BLOCK_ID: ${{ vars.ADSGRAM_BLOCK_ID }}
          # Межстраничная между главами — блок AdsGram int-…: gh variable set ADSGRAM_INTER_ID
          VITE_ADSGRAM_INTER_ID: ${{ vars.ADSGRAM_INTER_ID }}
      # Карты исходников прошлых сборок остаются на сайте: по ним сводка расшифровывает
      # стеки ошибок от игроков со старой версией
      - run: node scripts/keep-sourcemaps.mjs dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
