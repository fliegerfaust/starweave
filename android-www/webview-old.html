<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Звёздное плетение</title>
    <style>
      /* Страница для старого WebView (APK.5): никаких новых возможностей браузера, только простая вёрстка */
      html, body { margin: 0; height: 100%; background: #05061a; color: #e8e4f4; font: 16px/1.45 system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; padding: 32px 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 340px; }
      h1 { margin: 0 0 16px; font: 400 28px/1.2 Georgia, serif; letter-spacing: 0.06em; color: #ffd98a; }
      p { margin: 0 0 12px; color: #c9c3e6; }
      a { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 999px; background: #f6c25b; color: #1a1430; font-weight: 700; text-decoration: none; }
      .en { margin-top: 28px; font-size: 14px; color: #8f88b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Звёздное плетение</h1>
      <p>Игре нужен более новый Android System WebView: он показывает её на экране.</p>
      <p>Обновите его в Google Play и откройте игру снова.</p>
      <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Обновить WebView</a>
      <p class="en">Starweave needs a newer Android System WebView. Update it in Google Play and open the game again.</p>
    </main>
  </body>
</html>
